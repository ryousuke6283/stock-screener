name: Refresh stock data

on:
  schedule:
    # 毎日 22:00 UTC = 翌 07:00 JST（米国市場クローズ後・日本市場オープン前）
    - cron: "0 22 * * *"
  workflow_dispatch: {}   # GitHub の「Run workflow」ボタンで手動実行（スマホからも可）

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest data
        run: python fetch_data.py --workers 10

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.parquet
          git diff --staged --quiet || git commit -m "chore: refresh data ($(date -u +%Y-%m-%d))"
          git push
