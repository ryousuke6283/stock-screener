# kintai-css（BICEPSモノトーン業務SaaS デザインシステム）をStreamlitテーマに翻訳
[theme]
base = "light"
primaryColor = "#18181b"            # zinc-900: 主役は黒
backgroundColor = "#ffffff"         # ピュアホワイト
secondaryBackgroundColor = "#f4f4f5" # zinc-100: サイドバー/ホバー背景(やや濃いグレー)
textColor = "#1e293b"               # slate-800(やや黒寄り)
linkColor = "#2563eb"               # blue-600: 情報シグナルのみ
borderColor = "#d4d4d8"             # zinc-300: ヘアライン(やや濃く)
baseRadius = "large"                # ウィジェットを全体的に丸く
font = "sans serif"

[server]
headless = true
